name: CI/CD Pipeline — Deploy Chat App

on:
  push:
    branches:
      - main        # Trigger on push to main branch

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: CI — Lint & Validate before deploying
  # ─────────────────────────────────────────────
  ci:
    name: ✅ CI — Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r devops/app/requirements.txt

      - name: Lint with flake8
        continue-on-error: true
        run: |
          pip install flake8
          # Stop the build if there are Python syntax errors or undefined names
          flake8 devops/app/main.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all formatting errors as warnings without failing the build
          flake8 devops/app/main.py --count --exit-zero --max-line-length=120 --statistics || true

      - name: Validate Docker Compose file
        run: docker compose -f devops/docker-compose.yml config --quiet

  # ─────────────────────────────────────────────
  # JOB 2: CD — Deploy to EC2 via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 CD — Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci   # Only deploy if CI passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          EC2_HOST=$(echo "$EC2_HOST" | sed -e 's|^https*://||' -e 's/["'\'' ]//g' | tr -d '\r\n')
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_SSH_PRIVATE_KEY" ]; then
            echo "❌ Error: EC2_HOST or EC2_SSH_PRIVATE_KEY secret is not configured in GitHub Secrets!"
            exit 1
          fi
          mkdir -p ~/.ssh
          echo "$EC2_SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          EC2_HOST=$(echo "$EC2_HOST" | sed -e 's|^https*://||' -e 's/["'\'' ]//g' | tr -d '\r\n')
          EC2_USER=$(echo "$EC2_USER" | sed -e 's/["'\'' ]//g' | tr -d '\r\n')
          if [ -z "$EC2_HOST" ] || [ -z "$EC2_USER" ]; then
            echo "❌ Error: EC2_HOST or EC2_USER secret is not configured in GitHub Secrets!"
            exit 1
          fi
          echo "Connecting to ${EC2_USER}@${EC2_HOST}..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              "${EC2_USER}@${EC2_HOST}" << 'ENDSSH'

            set -e

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  📦 Step 0: Ensure Git & Docker Compose installed"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            if ! command -v git &> /dev/null; then
              echo "Git not found. Installing git..."
              sudo yum install -y git || sudo apt-get update && sudo apt-get install -y git
            fi

            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing docker..."
              sudo amazon-linux-extras install docker -y || sudo yum install -y docker || true
              sudo systemctl start docker || true
              sudo systemctl enable docker || true
              sudo usermod -aG docker "$USER" || true
            fi

            if ! docker compose version &> /dev/null; then
              echo "Docker Compose plugin not found. Installing..."
              DOCKER_CONFIG=${DOCKER_CONFIG:-$HOME/.docker}
              mkdir -p $DOCKER_CONFIG/cli-plugins
              curl -SL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64 \
                -o $DOCKER_CONFIG/cli-plugins/docker-compose || true
              chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose || true
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🔄 Step 1: Navigate to project directory"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            if [ -d "$HOME/app" ]; then
              cd "$HOME/app"
            else
              echo "Creating ~/app directory..."
              git clone https://github.com/Prenay123/Devops-Assignment.git "$HOME/app"
              cd "$HOME/app"
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  📥 Step 2: Pull latest code from GitHub"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            git fetch origin main
            git reset --hard origin/main

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🔨 Step 3: Rebuild & restart Docker containers"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cd devops
            docker compose build --no-cache
            docker compose up -d --remove-orphans

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🧹 Step 4: Clean up unused Docker resources"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker system prune -f --volumes=false

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🩺 Step 5: Health check"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            sleep 5
            docker compose ps
            curl --fail --silent --max-time 10 http://localhost || echo "⚠️ HTTP check failed — check nginx logs"

            echo ""
            echo "✅ Deployment complete!"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
