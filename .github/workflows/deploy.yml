name: CI/CD Pipeline — Deploy Chat App

on:
  push:
    branches:
      - main        # Trigger on push to main branch

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: CI — Lint & Validate before deploying
  # ─────────────────────────────────────────────
  ci:
    name: ✅ CI — Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r devops/app/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 devops/app/main.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 devops/app/main.py --count --max-line-length=120 --statistics

      - name: Validate Docker Compose file
        run: docker compose -f devops/docker-compose.yml config --quiet

  # ─────────────────────────────────────────────
  # JOB 2: CD — Deploy to EC2 via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 CD — Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci   # Only deploy if CI passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

            set -e

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🔄 Step 1: Navigate to project directory"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            if [ -d "$HOME/app" ]; then
              cd "$HOME/app"
            else
              echo "Creating ~/app directory..."
              git clone https://github.com/Prenay123/Devops-Assignment.git "$HOME/app"
              cd "$HOME/app"
            fi

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  📥 Step 2: Pull latest code from GitHub"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            git fetch origin main
            git reset --hard origin/main

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🔨 Step 3: Rebuild & restart Docker containers"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cd devops
            docker compose build --no-cache
            docker compose up -d --remove-orphans

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🧹 Step 4: Clean up unused Docker resources"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker system prune -f --volumes=false

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🩺 Step 5: Health check"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            sleep 5
            docker compose ps
            curl --fail --silent --max-time 10 http://localhost || echo "⚠️ HTTP check failed — check nginx logs"

            echo ""
            echo "✅ Deployment complete!"
          ENDSSH

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
