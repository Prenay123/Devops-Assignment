<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="'Segoe UI', system-ui, sans-serif">

  <!-- Background -->
  <rect width="1100" height="620" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="550" y="38" text-anchor="middle" fill="#e6edf3" font-size="20" font-weight="700">Real-Time Chat App — Deployment Architecture</text>
  <line x1="80" y1="50" x2="1020" y2="50" stroke="#30363d" stroke-width="1"/>

  <!-- ═══════════════════════════════════ -->
  <!-- SECTION 1: Developer               -->
  <!-- ═══════════════════════════════════ -->
  <rect x="30" y="200" width="130" height="110" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="95" y="230" text-anchor="middle" fill="#58a6ff" font-size="28">💻</text>
  <text x="95" y="255" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="600">Developer</text>
  <text x="95" y="273" text-anchor="middle" fill="#8b949e" font-size="11">git push</text>
  <text x="95" y="288" text-anchor="middle" fill="#8b949e" font-size="11">to main</text>

  <!-- Arrow: Developer → GitHub -->
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#58a6ff"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#2ea043"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#d29922"/>
    </marker>
    <marker id="arrow-ws" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a371f7"/>
    </marker>
  </defs>
  <line x1="162" y1="255" x2="210" y2="255" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5,3"/>
  <text x="183" y="248" text-anchor="middle" fill="#58a6ff" font-size="9">push</text>

  <!-- ═══════════════════════════════════ -->
  <!-- SECTION 2: GitHub Actions          -->
  <!-- ═══════════════════════════════════ -->
  <rect x="212" y="150" width="185" height="220" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="304" y="175" text-anchor="middle" fill="#e6edf3" font-size="13" font-weight="700">GitHub Actions</text>
  <text x="304" y="191" text-anchor="middle" fill="#8b949e" font-size="10">CI/CD Pipeline</text>

  <!-- CI Job box -->
  <rect x="228" y="200" width="153" height="70" rx="7" fill="#0d1117" stroke="#2ea043" stroke-width="1.5"/>
  <text x="304" y="221" text-anchor="middle" fill="#2ea043" font-size="11" font-weight="700">✅ Job 1 — CI</text>
  <text x="304" y="238" text-anchor="middle" fill="#8b949e" font-size="10">• Lint Python (flake8)</text>
  <text x="304" y="253" text-anchor="middle" fill="#8b949e" font-size="10">• Validate docker-compose</text>
  <text x="304" y="265" text-anchor="middle" fill="#8b949e" font-size="10">• Check syntax errors</text>

  <!-- Arrow CI → CD -->
  <line x1="304" y1="270" x2="304" y2="282" stroke="#30363d" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- CD Job box -->
  <rect x="228" y="284" width="153" height="72" rx="7" fill="#0d1117" stroke="#1f6feb" stroke-width="1.5"/>
  <text x="304" y="305" text-anchor="middle" fill="#58a6ff" font-size="11" font-weight="700">🚀 Job 2 — CD</text>
  <text x="304" y="321" text-anchor="middle" fill="#8b949e" font-size="10">• SSH into EC2</text>
  <text x="304" y="336" text-anchor="middle" fill="#8b949e" font-size="10">• git pull latest code</text>
  <text x="304" y="351" text-anchor="middle" fill="#8b949e" font-size="10">• Rebuild &amp; restart Docker</text>

  <!-- Arrow: GitHub → EC2 (SSH) -->
  <line x1="397" y1="320" x2="450" y2="320" stroke="#d29922" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="421" y="312" text-anchor="middle" fill="#d29922" font-size="9" font-weight="600">SSH :22</text>

  <!-- ═══════════════════════════════════════════════════ -->
  <!-- SECTION 3: AWS EC2 Instance                        -->
  <!-- ═══════════════════════════════════════════════════ -->
  <rect x="452" y="80" width="530" height="460" rx="12" fill="#161b22" stroke="#d29922" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="717" y="108" text-anchor="middle" fill="#d29922" font-size="13" font-weight="700">☁  AWS EC2 Instance (Amazon Linux 2)</text>
  <text x="717" y="125" text-anchor="middle" fill="#8b949e" font-size="10">Security Group: Port 22 (SSH) · Port 80 (HTTP)</text>

  <!-- Docker Network box -->
  <rect x="472" y="138" width="490" height="375" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="717" y="162" text-anchor="middle" fill="#8b949e" font-size="11" font-weight="600">Docker Network: chat-network (bridge)</text>

  <!-- ── chat-nginx container ── -->
  <rect x="488" y="178" width="210" height="300" rx="8" fill="#161b22" stroke="#2ea043" stroke-width="2"/>
  <rect x="488" y="178" width="210" height="36" rx="8" fill="#2ea043" fill-opacity="0.15"/>
  <text x="593" y="200" text-anchor="middle" fill="#2ea043" font-size="13" font-weight="700">chat-nginx</text>
  <text x="593" y="215" text-anchor="middle" fill="#2ea043" font-size="9">nginx:alpine</text>

  <text x="593" y="242" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Listens: Port 80 (public)</text>

  <line x1="510" y1="252" x2="680" y2="252" stroke="#30363d" stroke-width="1"/>

  <text x="593" y="270" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="600">Routing Rules:</text>
  <rect x="502" y="276" width="184" height="24" rx="4" fill="#1c2433"/>
  <text x="594" y="292" text-anchor="middle" fill="#e6edf3" font-size="10">GET /  →  serve index.html</text>
  <rect x="502" y="306" width="184" height="24" rx="4" fill="#1c2433"/>
  <text x="594" y="322" text-anchor="middle" fill="#a371f7" font-size="10">WS  /ws  →  proxy_pass ↓</text>

  <line x1="510" y1="338" x2="680" y2="338" stroke="#30363d" stroke-width="1"/>

  <text x="593" y="356" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="600">WebSocket Headers:</text>
  <text x="593" y="372" text-anchor="middle" fill="#8b949e" font-size="9">Upgrade: websocket</text>
  <text x="593" y="385" text-anchor="middle" fill="#8b949e" font-size="9">Connection: Upgrade</text>
  <text x="593" y="398" text-anchor="middle" fill="#8b949e" font-size="9">proxy_http_version 1.1</text>
  <text x="593" y="411" text-anchor="middle" fill="#8b949e" font-size="9">proxy_buffering off</text>
  <text x="593" y="424" text-anchor="middle" fill="#8b949e" font-size="9">timeout: 3600s</text>

  <line x1="510" y1="433" x2="680" y2="433" stroke="#30363d" stroke-width="1"/>
  <text x="593" y="453" text-anchor="middle" fill="#8b949e" font-size="9">Vol: ./frontend → /usr/share/nginx/html</text>
  <text x="593" y="466" text-anchor="middle" fill="#8b949e" font-size="9">Vol: ./nginx.conf → /etc/nginx/nginx.conf</text>

  <!-- Arrow: nginx → backend (internal) -->
  <line x1="698" y1="325" x2="735" y2="325" stroke="#a371f7" stroke-width="2" marker-end="url(#arrow-ws)"/>
  <text x="716" y="315" text-anchor="middle" fill="#a371f7" font-size="8">proxy_pass</text>
  <text x="716" y="325" text-anchor="middle" fill="#a371f7" font-size="8">:8000/ws</text>

  <!-- ── chat-backend container ── -->
  <rect x="738" y="178" width="210" height="300" rx="8" fill="#161b22" stroke="#1f6feb" stroke-width="2"/>
  <rect x="738" y="178" width="210" height="36" rx="8" fill="#1f6feb" fill-opacity="0.15"/>
  <text x="843" y="200" text-anchor="middle" fill="#58a6ff" font-size="13" font-weight="700">chat-backend</text>
  <text x="843" y="215" text-anchor="middle" fill="#58a6ff" font-size="9">Python · FastAPI · Uvicorn</text>

  <text x="843" y="242" text-anchor="middle" fill="#e6edf3" font-size="11" font-weight="600">Exposed: Port 8000 (internal)</text>

  <line x1="752" y1="252" x2="935" y2="252" stroke="#30363d" stroke-width="1"/>

  <text x="843" y="270" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="600">API Endpoints:</text>
  <rect x="752" y="276" width="184" height="24" rx="4" fill="#1c2433"/>
  <text x="844" y="292" text-anchor="middle" fill="#e6edf3" font-size="10">GET /  →  FileResponse (HTML)</text>
  <rect x="752" y="306" width="184" height="24" rx="4" fill="#1c2433"/>
  <text x="844" y="322" text-anchor="middle" fill="#a371f7" font-size="10">WebSocket /ws endpoint</text>

  <line x1="752" y1="338" x2="935" y2="338" stroke="#30363d" stroke-width="1"/>

  <text x="843" y="356" text-anchor="middle" fill="#8b949e" font-size="10" font-weight="600">ConnectionManager:</text>
  <text x="843" y="372" text-anchor="middle" fill="#8b949e" font-size="9">• Tracks active connections</text>
  <text x="843" y="386" text-anchor="middle" fill="#8b949e" font-size="9">• Assigns Guest_XXXX usernames</text>
  <text x="843" y="400" text-anchor="middle" fill="#8b949e" font-size="9">• Broadcasts chat messages</text>
  <text x="843" y="414" text-anchor="middle" fill="#8b949e" font-size="9">• Sends join/leave notifications</text>
  <text x="843" y="428" text-anchor="middle" fill="#8b949e" font-size="9">• Emits live user count (stats)</text>

  <line x1="752" y1="438" x2="935" y2="438" stroke="#30363d" stroke-width="1"/>
  <text x="843" y="457" text-anchor="middle" fill="#8b949e" font-size="9">Bind: 0.0.0.0:8000  (all interfaces)</text>
  <text x="843" y="470" text-anchor="middle" fill="#8b949e" font-size="9">User: appuser (non-root)</text>

  <!-- ═══════════════════════════════════ -->
  <!-- SECTION 4: Users (right side)      -->
  <!-- ═══════════════════════════════════ -->
  <rect x="1005" y="190" width="75" height="100" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="1042" y="222" text-anchor="middle" fill="#e6edf3" font-size="22">🌐</text>
  <text x="1042" y="244" text-anchor="middle" fill="#e6edf3" font-size="12" font-weight="600">Users</text>
  <text x="1042" y="260" text-anchor="middle" fill="#8b949e" font-size="9">Browser</text>
  <text x="1042" y="273" text-anchor="middle" fill="#8b949e" font-size="9">Port 80</text>

  <!-- Arrow: Users → nginx HTTP -->
  <line x1="1004" y1="225" x2="982" y2="225" stroke="#2ea043" stroke-width="1.5" marker-end="url(#arrow-green)"/>
  <text x="992" y="218" text-anchor="middle" fill="#2ea043" font-size="8">HTTP</text>

  <!-- Arrow: Users → nginx WS -->
  <line x1="1004" y1="260" x2="982" y2="260" stroke="#a371f7" stroke-width="1.5" marker-end="url(#arrow-ws)"/>
  <text x="992" y="273" text-anchor="middle" fill="#a371f7" font-size="8">WebSocket</text>

  <!-- ═══════════════════════════ -->
  <!-- Bottom legend              -->
  <!-- ═══════════════════════════ -->
  <line x1="80" y1="570" x2="1020" y2="570" stroke="#30363d" stroke-width="1"/>
  <!-- Legend items -->
  <line x1="100" y1="590" x2="130" y2="590" stroke="#2ea043" stroke-width="2"/>
  <text x="135" y="594" fill="#8b949e" font-size="10">HTTP Traffic</text>

  <line x1="230" y1="590" x2="260" y2="590" stroke="#a371f7" stroke-width="2"/>
  <text x="265" y="594" fill="#8b949e" font-size="10">WebSocket</text>

  <line x1="360" y1="590" x2="390" y2="590" stroke="#d29922" stroke-width="2"/>
  <text x="395" y="594" fill="#8b949e" font-size="10">SSH / Deploy</text>

  <line x1="490" y1="590" x2="520" y2="590" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="525" y="594" fill="#8b949e" font-size="10">Git Push</text>

  <rect x="620" y="582" width="12" height="12" rx="2" fill="none" stroke="#d29922" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="637" y="594" fill="#8b949e" font-size="10">AWS EC2 Boundary</text>

  <rect x="780" y="582" width="12" height="12" rx="2" fill="none" stroke="#30363d" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="797" y="594" fill="#8b949e" font-size="10">Docker Network Boundary</text>

</svg>
