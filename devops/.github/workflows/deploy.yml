name: CI/CD Pipeline — Deploy Chat App

on:
  push:
    branches:
      - main        # Trigger on push to main branch

# Cancel any in-progress deployment if a new push arrives
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: CI — Lint & Validate before deploying
  # ─────────────────────────────────────────────
  ci:
    name: ✅ CI — Lint & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # Fail on syntax errors or undefined names; warn on style
          flake8 app/main.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app/main.py --count --max-line-length=120 --statistics

      - name: Validate Docker Compose file
        run: docker compose config --quiet

  # ─────────────────────────────────────────────
  # JOB 2: CD — Deploy to EC2 via SSH
  # ─────────────────────────────────────────────
  deploy:
    name: 🚀 CD — Deploy to EC2
    runs-on: ubuntu-latest
    needs: ci   # Only deploy if CI passes

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Set up SSH key ──────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Add server to known_hosts to avoid interactive prompt
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # ── Deploy steps run on the EC2 server ─────
      - name: Deploy on EC2
        run: |
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'

            set -e   # Exit immediately on any error

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🔄 Step 1: Navigate to project directory"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            cd ~/app || { echo "❌ Directory ~/app not found"; exit 1; }

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  📥 Step 2: Pull latest code from GitHub"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            git fetch origin main
            git reset --hard origin/main

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🔨 Step 3: Rebuild Docker images (no cache)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker compose build --no-cache

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  ♻️  Step 4: Restart containers (zero downtime)"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker compose up -d --remove-orphans

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🧹 Step 5: Clean up unused Docker resources"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            docker system prune -f --volumes=false

            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "  🩺 Step 6: Health check"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            sleep 5
            docker compose ps
            curl --fail --silent --max-time 10 http://localhost || echo "⚠️ HTTP check failed — check nginx logs"

            echo ""
            echo "✅ Deployment complete!"
          ENDSSH

      # ── Cleanup SSH key after deploy ────────────
      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
