services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chat-backend

    expose:
      - "8000"

    environment:
      PYTHONUNBUFFERED: "1"

    restart: unless-stopped

    networks:
      - chat-network

  nginx:
    image: nginx:alpine

    container_name: chat-nginx

    ports:
      - "80:80"

    volumes:
      # Frontend
      - ./frontend:/usr/share/nginx/html:ro

      # NGINX Configuration
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - chat-network

networks:
  chat-network:
    name: chat-network
    driver: bridge